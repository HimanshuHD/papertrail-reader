name: Publish website
on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to deploy; leave blank to republish main'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Select a trusted successful build
        id: select
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { previewDecision } = await import(require('node:url').pathToFileURL(process.cwd() + '/scripts/deploy-policy.mjs').href);
            const manual = context.eventName === 'workflow_dispatch';
            const requested = context.payload.inputs?.pr_number?.trim() || '';
            let run = context.payload.workflow_run, selectedPR;
            if (manual) {
              if (requested) {
                if (!/^[1-9]\d*$/.test(requested)) throw new Error('Enter a positive PR number');
                selectedPR = (await github.rest.pulls.get({owner,repo,pull_number:Number(requested)})).data;
                if (selectedPR.state !== 'open' || selectedPR.base.ref !== 'main' || selectedPR.head.repo?.full_name !== owner + '/' + repo) throw new Error('Choose an open same-repository PR targeting main');
              }
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', ...(selectedPR ? {head_sha:selectedPR.head.sha,event:'pull_request'} : {branch:'main',event:'push'}), status:'success', per_page:10 });
              run = runs.data.workflow_runs.find(r => !selectedPR || r.head_sha === selectedPR.head.sha);
              if (!run) throw new Error('The current commit has no successful CI build; wait for CI or fix it first');
            }
            if (run.head_repository?.full_name !== owner + '/' + repo || !['push','pull_request'].includes(run.event)) { core.setOutput('skip','true'); return; }
            let kind='production', prNumber='';
            if (run.event === 'pull_request') {
              if (!selectedPR) {
                const candidates = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:run.head_sha});
                selectedPR=candidates.data.find(p => p.base.ref==='main' && p.head.repo?.full_name===owner+'/'+repo && p.head.sha===run.head_sha);
              }
              if (!selectedPR) { core.setOutput('skip','true'); return; }
              const fresh=(await github.rest.pulls.get({owner,repo,pull_number:selectedPR.number})).data;
              kind=previewDecision({manual,state:fresh.state,currentSha:fresh.head.sha,buildSha:run.head_sha,sameRepo:fresh.head.repo?.full_name===owner+'/'+repo,target:fresh.base.ref});
              if (kind==='skip') { if(manual) throw new Error('PR head changed; rebuild and retry'); core.setOutput('skip','true'); return; }
              prNumber=fresh.number;
            } else if(run.head_branch!=='main') { core.setOutput('skip','true'); return; }
            core.setOutput('kind',kind);
            core.setOutput('pr',prNumber);
            core.setOutput('run_id',run.id);
            core.setOutput('sha',run.head_sha);
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.kind != 'retire'
        with:
          name: web-build
          path: incoming
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run_id }}
      - name: Verify artifact identity
        id: verify
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.kind != 'retire'
        env:
          EXPECTED_SHA: ${{ steps.select.outputs.sha }}
          EXPECTED_RUN: ${{ steps.select.outputs.run_id }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const b=JSON.parse(fs.readFileSync('incoming/build.json','utf8')); if(b.sha!==process.env.EXPECTED_SHA || String(b.runId)!==process.env.EXPECTED_RUN) throw Error('Artifact identity mismatch'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish='+String(process.env.MANUAL==='true' || b.publish!==false)+'\\n')"
      - name: Preserve production and all previews
        if: steps.select.outputs.skip != 'true' && (steps.select.outputs.kind == 'retire' || steps.verify.outputs.publish == 'true')
        env:
          KIND: ${{ steps.select.outputs.kind }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          BUILD_SHA: ${{ steps.select.outputs.sha }}
          BUILD_RUN: ${{ steps.select.outputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/pages-state >/dev/null 2>&1; then
            git fetch origin pages-state
            git worktree add --detach _site FETCH_HEAD
          else
            git worktree add --detach _site HEAD
            git -C _site checkout --orphan pages-state
            git -C _site rm -rf .
          fi
          node --input-type=module -e "import {assemble} from './scripts/assemble-pages.mjs'; await assemble({site:'_site',artifact:'incoming',kind:process.env.KIND,pr:process.env.PR_NUMBER,sha:process.env.BUILD_SHA,runId:process.env.BUILD_RUN})"
          git -C _site add -A
          if ! git -C _site diff --cached --quiet; then
            git -C _site commit -m "deploy: update ${KIND} website build"
            git -C _site push origin HEAD:pages-state
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.select.outputs.skip != 'true' && (steps.select.outputs.kind == 'retire' || steps.verify.outputs.publish == 'true')
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy
        if: steps.select.outputs.skip != 'true' && (steps.select.outputs.kind == 'retire' || steps.verify.outputs.publish == 'true')
      - name: Record URLs
        if: steps.select.outputs.skip != 'true' && (steps.select.outputs.kind == 'retire' || steps.verify.outputs.publish == 'true')
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          KIND: ${{ steps.select.outputs.kind }}
          PR_NUMBER: ${{ steps.select.outputs.pr }}
        run: |
          echo "Production: ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            echo "PR ${PR_NUMBER}: ${SITE_URL}preview/pr-${PR_NUMBER}/ (${KIND})" >> "$GITHUB_STEP_SUMMARY"
          fi
