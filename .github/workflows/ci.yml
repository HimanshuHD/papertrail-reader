name: Frontend CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retire-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Closed PR preview will be retired by the trusted publisher.'
  frontend:
    if: github.event.action != 'closed'
    name: Validate and build website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/assemble-pages.test.mjs
      - name: Build for production or PR path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/papertrail-reader/' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            npm run build -- --base "${BASE_PATH}preview/pr-${PR_NUMBER}/"
          else
            npm run build -- --base "$BASE_PATH"
          fi
      - name: Record artifact identity
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('dist/build.json', JSON.stringify({sha:process.env.SOURCE_SHA,runId:process.env.GITHUB_RUN_ID}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: dist/
          retention-days: 7
