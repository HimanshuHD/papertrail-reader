name: Frontend CI
on:
  pull_request:
    branches: [main, staging]
    types: [opened, ready_for_review, synchronize, reopened, converted_to_draft, edited, labeled]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: frontend-ci-${{ github.event.action == 'labeled' && github.event.label.name == 'qa:visual' && format('visual-{0}', github.event.pull_request.number) || (github.event.action == 'labeled' || (github.event.action == 'edited' && github.event.changes.base == null)) && format('metadata-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Validate and build website
    if: github.event_name == 'workflow_dispatch' || ((github.event.pull_request.state == 'open' && github.event.pull_request.draft == false) && (github.event.action != 'edited' || github.event.changes.base != null) && (github.event.action != 'labeled' || github.event.label.name == 'qa:visual'))
    outputs:
      website: ${{ steps.build.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run type-check
      - name: Build channel-specific candidates
        id: build
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/papertrail-reader/' }}
        run: node scripts/build-candidates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-build
          path: candidate/
          retention-days: 30
          overwrite: true
  browser:
    needs: frontend
    if: needs.frontend.outputs.website == 'true' && ((github.event.pull_request.base.ref == 'main' && (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false)) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/browser-e2e.yml
    with:
      build_run: ${{ format('{0}', github.run_id) }}
      channel: production
      source_ref: ${{ github.sha }}
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  gate:
    name: ${{ (github.event_name == 'workflow_dispatch' || ((github.event.pull_request.state == 'open' && github.event.pull_request.draft == false) && (github.event.action != 'edited' || github.event.changes.base != null) && (github.event.action != 'labeled' || github.event.label.name == 'qa:visual'))) && 'Candidate validation' || 'Metadata event (no candidate validation)' }}
    timeout-minutes: 20
    if: always() && (github.event_name == 'workflow_dispatch' || ((github.event.pull_request.state == 'open' && github.event.pull_request.draft == false) && (github.event.action != 'edited' || github.event.changes.base != null) && (github.event.action != 'labeled' || github.event.label.name == 'qa:visual')))
    needs: [frontend, browser]
    outputs:
      candidate_run: ${{ github.run_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required candidate checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          TARGET: ${{ github.event.pull_request.base.ref || github.ref_name }}
          WEBSITE: ${{ needs.frontend.outputs.website }}
        run: |
          test "$FRONTEND" = success
          if [ "$TARGET" = main ] && [ "$WEBSITE" = true ]; then test "$BROWSER" = success; fi

  visual-qa:
    name: Visual QA
    needs: gate
    if: always() && needs.gate.result == 'success' && (github.event.action != 'edited' || github.event.changes.base != null) && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'qa:visual')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/visual-qa.yml
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      profile: auto
      tooling_sha: ${{ github.event.pull_request.base.sha }}
      candidate_run: ${{ needs.gate.outputs.candidate_run }}
