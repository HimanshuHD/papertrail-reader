name: Bootstrap lockfile
on:
  push:
    branches: [chore/3-vue-vite-bootstrap]
    paths: [package.json, .github/workflows/bootstrap-lockfile.yml]
permissions:
  contents: write
concurrency:
  group: bootstrap-lockfile
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/3-vue-vite-bootstrap
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Generate lockfile on GitHub
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and production build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit the verified lockfile
        run: |
          if ! git diff --quiet -- package-lock.json || [ ! -f "$(git rev-parse --show-toplevel)/package-lock.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: record verified dependency lockfile (refs #3)"
            git push origin HEAD:chore/3-vue-vite-bootstrap
          elif ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: record verified dependency lockfile (refs #3)"
            git push origin HEAD:chore/3-vue-vite-bootstrap
          fi
