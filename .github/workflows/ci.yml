name: Frontend CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  retire-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Closed PR preview will be retired by the trusted publisher.'
  frontend:
    if: github.event.action != 'closed'
    name: Validate and build website
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build for production or PR path
        env:
          VITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          VITE_PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/papertrail-reader/' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            DEPLOY_BASE="${BASE_PATH}preview/pr-${PR_NUMBER}/"
          else
            DEPLOY_BASE="$BASE_PATH"
          fi
          npm run build -- --base "$DEPLOY_BASE"
          echo "E2E_BASE_PATH=$DEPLOY_BASE" >> "$GITHUB_ENV"
      - name: Record artifact identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node scripts/build-info.mjs
      - name: Install browser binaries and system dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps --only-shell chromium
      - name: Validate the built website in browsers
        run: npm run test:e2e
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: dist/
          retention-days: 7
